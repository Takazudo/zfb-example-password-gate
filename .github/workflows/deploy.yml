# Cloudflare Workers (static assets) deploy for this zfb example.
#
#   build  — always runs (push + PR): install, typecheck (`zfb check`), test
#            (`vitest run`), build (`zfb build`). This is the L3 build-output
#            gate; it needs no Cloudflare credentials, so a fresh clone/fork is
#            green immediately.
#   deploy — push to `main` only: runs `wrangler deploy`, but SELF-SKIPS when
#              * secrets.CLOUDFLARE_API_TOKEN is unset, or
#              * wrangler.toml still holds a REPLACE_WITH_* placeholder id.
#            So the repo never shows a red deploy before Cloudflare is wired up.
#            It then runs `pnpm smoke` against the custom domain with
#            SMOKE_REQUIRE_LIVE=1, so an unreachable site fails instead of
#            self-skipping — the domain is attached and serving today.
#
# Enable deploys by adding, in repo Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   token with Account · Workers Scripts: Edit,
#                          Account · Account Settings: Read, and
#                          Zone · Workers Routes: Edit (required by the
#                          custom_domain route in wrangler.toml — without it
#                          `wrangler deploy` fails on the route step). This
#                          example declares only the ASSETS binding — no KV, AI,
#                          or D1 — so no further permissions are needed.
#   CLOUDFLARE_ACCOUNT_ID  target Cloudflare account id
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  # Never interrupt an in-flight `wrangler deploy`: a push-triggered run must finish.
  # PR builds are still superseded — they group separately (github.ref is refs/pull/N/merge).
  # Note: with cancellation off GitHub queues at most one pending run per group, so a third
  # rapid push displaces the queued second one; the running deploy is never touched.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (typecheck + test + zfb build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Preflight — is Cloudflare configured?
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping deploy. Add it and CLOUDFLARE_ACCOUNT_ID in repo Settings to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q "REPLACE_WITH" wrangler.toml; then
            echo "::notice::wrangler.toml still has a REPLACE_WITH_* placeholder — provision the resource, commit the real id, then deploy will run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      # Confirms the custom domain is attached AND the gate is running ahead of
      # the asset layer. Needs dist/ from the Build step above to pick a real
      # asset path.
      #
      # SMOKE_REQUIRE_LIVE=1 retires the script's self-skip: this domain is
      # attached and serving, so "not reachable yet" is now an outage rather than
      # a pending setup step and must go red instead of quietly exiting 0. The
      # skip path stays in scripts/smoke.mjs for a fresh clone that has not wired
      # up Cloudflare yet — drop this env block there and it self-skips again.
      - name: Smoke test — is the live gate actually gating?
        if: steps.preflight.outputs.ready == 'true'
        env:
          SMOKE_REQUIRE_LIVE: "1"
        run: pnpm smoke
